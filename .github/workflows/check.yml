name: Check

on:
    push:
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: google-chrome --version
            - run: npm run evidence
              env:
                  MOVIEHUB_EVIDENCE_DIR: ${{ runner.temp }}/moviehub-evidence
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: verification-evidence
                  path: |
                      ${{ runner.temp }}/moviehub-evidence/*.json
                      ${{ runner.temp }}/moviehub-evidence/*-output.txt
